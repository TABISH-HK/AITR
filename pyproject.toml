[project]
name = "itr-computation-system"
version = "1.0.0"
description = "AI-Based ITR Computation System"
readme = "ITR-System/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "main:app"
